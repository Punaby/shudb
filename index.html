<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hyperbeam Browser Embed</title>
</head>
<body>
  <form id="roomForm">
    <label for="roomKey">Enter your Hyperbeam Room Key:</label>
    <input type="text" id="roomKey" required>
    <button type="submit">Load Browser</button>
  </form>
  <div id="embed"></div>
  <script>
    document.getElementById('roomForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const key = document.getElementById('roomKey').value.trim();
      if(!key) return;
      document.getElementById('embed').innerHTML =
        `<iframe src="https://hyperbeam.com/embed/${encodeURIComponent(key)}?autojoin=true" allow="microphone; camera; clipboard-read; clipboard-write"></iframe>`;
    });
  </script>
</body>
</html>
